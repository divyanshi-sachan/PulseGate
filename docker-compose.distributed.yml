# Two gateway instances sharing one Redis rate-limit budget (ADR-0034).
#   pnpm dev:distributed   (= docker compose -f docker-compose.yml -f docker-compose.distributed.yml up --build)
# Instance 1 on :8080, instance 2 on :8081. REDIS_PASSWORD is a local-only default.

x-redis-env: &redis-env
  PULSEGATE_CONFIG: /config/routes.yaml
  PULSEGATE_CLIENTS: /config/clients.yaml
  REDIS_URL: redis://:${REDIS_PASSWORD:-pulsegate-local-only}@redis:6379
  LOG_LEVEL: info

services:
  redis:
    image: redis:7.4.11-alpine
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-pulsegate-local-only}',
        '--save',
        '',
        '--appendonly',
        'no',
      ]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'redis-cli -a "$${REDIS_PASSWORD:-pulsegate-local-only}" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 2s
      timeout: 2s
      retries: 15
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-pulsegate-local-only}

  gateway:
    environment: *redis-env
    volumes:
      - ./config/routes.distributed.example.yaml:/config/routes.yaml:ro
      - ./config/clients.example.yaml:/config/clients.yaml:ro
    depends_on:
      redis:
        condition: service_healthy

  gateway-2:
    build:
      context: .
      target: gateway
    environment: *redis-env
    volumes:
      - ./config/routes.distributed.example.yaml:/config/routes.yaml:ro
      - ./config/clients.example.yaml:/config/clients.yaml:ro
    ports:
      - '8081:8080'
    depends_on:
      redis:
        condition: service_healthy
      orders-mock:
        condition: service_healthy
      payments-mock:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:9091/ready').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
